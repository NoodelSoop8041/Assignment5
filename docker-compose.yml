
services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      DB_PATH: /backend/recipes.db
    volumes:
      - recipe-data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  recipe-data:
